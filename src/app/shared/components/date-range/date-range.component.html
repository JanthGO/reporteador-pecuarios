<div class="date-range-picker" (click)="$event.stopPropagation()">
  <button
    class="date-range-trigger"
    (click)="toggleOpen()"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="dialog"
    type="button"
  >
    <svg lucideCalendar class="date-range-trigger__icon" [size]="16"></svg>
    <span class="date-range-trigger__text">{{ displayText() }}</span>
    <svg lucideChevronDown class="date-range-trigger__chevron" [class.date-range-trigger__chevron--open]="isOpen()" [size]="14"></svg>
  </button>

  @if (isOpen()) {
    <div class="date-range-dropdown" role="dialog" aria-label="Seleccionar rango de fechas">
      <div class="date-range-dropdown__header">
        <span class="date-range-dropdown__title">Rango de fechas</span>
      </div>

      <div class="date-range-dropdown__fields">
        <div class="date-range-field">
          <label class="date-range-field__label" for="fecha-inicio">Fecha inicial</label>
          <input
            id="fecha-inicio"
            class="date-range-field__input"
            type="date"
            [max]="fechaFin() || today()"
            [value]="fechaInicio()"
            (input)="fechaInicio.set($any($event.target).value)"
          />
        </div>
        <span class="date-range-dropdown__separator">–</span>
        <div class="date-range-field">
          <label class="date-range-field__label" for="fecha-fin">Fecha final</label>
          <input
            id="fecha-fin"
            class="date-range-field__input"
            type="date"
            [min]="fechaInicio()"
            [max]="today()"
            [value]="fechaFin()"
            (input)="fechaFin.set($any($event.target).value)"
          />
        </div>
      </div>

      @if (error()) {
        <p class="date-range-dropdown__error" role="alert">{{ error() }}</p>
      }

      <div class="date-range-dropdown__actions">
        <button class="date-range-btn date-range-btn--ghost" type="button" (click)="onClear()">
          Restablecer
        </button>
        <button class="date-range-btn date-range-btn--primary" type="button" (click)="onApply()">
          Aplicar
        </button>
      </div>
    </div>
  }
</div>
