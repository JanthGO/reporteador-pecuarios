<header class="topbar">
  <div class="topbar__left">
    <button type="button" class="topbar__menu" aria-label="Abrir menú" (click)="menuClick.emit()">
      <svg lucideMenu [size]="20"></svg>
    </button>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      @for (item of breadcrumb(); track $index) {
        @if (!$last) {
          <span class="breadcrumb__item">{{ item }}</span>
          <span class="breadcrumb__sep">/</span>
        } @else {
          <span class="breadcrumb__item breadcrumb__item--current">{{ item }}</span>
        }
      }
    </nav>
  </div>
  <div class="topbar__right">
    <span class="topbar__name">{{ userName() }}</span>
    <div class="topbar__avatar">{{ avatarInitial() }}</div>
  </div>
</header>
