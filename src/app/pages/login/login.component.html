<div class="login-layout">
  <aside class="brand-panel">
    <div class="brand-panel__logo">
      <img [src]="'./assets/img/logos/'+logo_sitio" alt="logo-del-sitio">
    </div>
  </aside>

  <main class="form-panel">
    <div class="form-panel__inner">
      <div class="form-panel__header">
        <h1>Iniciar sesión</h1>
        <p>Ingresa tus credenciales para acceder al dashboard.</p>
      </div>

      <form class="login-form" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-field" [class.form-field--error]="emailError()">
          <label class="form-field__label" for="email">Correo electrónico</label>
          <div class="form-field__input-wrap">
            <svg lucideMail class="form-field__icon" [size]="18" aria-hidden="true"></svg>
            <input id="email" type="email" class="form-field__input" placeholder="nombre@pecuarios.com"
              [ngModel]="email()" (ngModelChange)="email.set($event)" (blur)="onEmailBlur()" name="email"
              autocomplete="email" [attr.aria-invalid]="emailError() ? true : null"
              [attr.aria-describedby]="emailError() ? 'email-error' : null" />
          </div>
          <p class="form-field__error" id="email-error" *ngIf="emailError()" role="alert">
            {{ emailError() }}
          </p>
        </div>

        <div class="form-field" [class.form-field--error]="passwordError()">
          <label class="form-field__label" for="password">Contraseña</label>
          <div class="form-field__input-wrap">
            <svg lucideLock class="form-field__icon" [size]="18" aria-hidden="true"></svg>
            <input id="password" [type]="showPassword() ? 'text' : 'password'"
              class="form-field__input form-field__input--password" placeholder="••••••••" [ngModel]="password()"
              (ngModelChange)="password.set($event)" (blur)="onPasswordBlur()" name="password"
              autocomplete="current-password" [attr.aria-invalid]="passwordError() ? true : null"
              [attr.aria-describedby]="passwordError() ? 'password-error' : null" />
            <button type="button" class="form-field__toggle" (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              @if (showPassword()){
              <svg lucideEyeOff [size]="18"></svg>
              }
              @else{
              <svg lucideEye [size]="18"></svg>
              }
            </button>
          </div>
          @if (passwordError()){
          <p class="form-field__error" id="password-error" role="alert">
            {{ passwordError() }}
          </p>
          }
        </div>

        @if (error()){
        <p class="login-form__auth-error" role="alert">
          {{ error() }}
        </p>
        }

        <button type="submit" class="btn-sitio" [disabled]="loading() || !formValid()" [class.btn-sitio--loading]="loading()">
          @if (loading()){
            <span class="btn-sitio__spinner"></span>
          }
          <span [class.btn-sitio__text--hidden]="loading()">
            {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
          </span>
        </button>
      </form>
    </div>
    <app-footer></app-footer>
  </main>
</div>
