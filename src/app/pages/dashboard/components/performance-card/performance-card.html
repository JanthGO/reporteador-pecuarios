<div
  class="content-card"
  [class.content-card--empty]="visitas() === 0"
  [class.content-card--selected]="selected()"
  (click)="cardClick.emit()"
  role="button"
  tabindex="0"
  (keydown.enter)="cardClick.emit()"
  (keydown.space)="cardClick.emit(); $event.preventDefault()"
>
  <div class="content-card__icon" [class]="iconClass()">
    <span [innerHTML]="svgIcon()"></span>
  </div>
  <div class="content-card__body">
    <div class="content-card__top">
      <span class="content-card__name">{{ titulo() }}</span>
    </div>
    <div class="content-card__count" [class.content-card_count--zero_]="visitas() === 0">
      {{ visitas() === 0 ? '0' : (visitas() | number) }}
    </div>
    
    @if (visitas() === 0) {
      <div class="content-card__trend content-card__trend--neutral">
        Sin actividad
      </div>
    } 
    @else {
      <div class="content-card__trend content-card__trend--up">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>
                +15.7%
              </div>
    }
  </div>
</div>
