<div
  class="content-card"
  [class.content-card--empty]="visitas() === 0"
  [class.content-card--selected]="selected()"
  (click)="cardClick.emit()"
  role="button"
  tabindex="0"
  (keydown.enter)="cardClick.emit()"
  (keydown.space)="cardClick.emit(); $event.preventDefault()"
>
  <div class="content-card__icon" [class]="iconClass()">
    <svg [lucideIcon]="iconName()" [size]="20"></svg>
  </div>
  <div class="content-card__body">
    <div class="content-card__top">
      <span class="content-card__name">{{ titulo() }}</span>
    </div>
    <div class="content-card__count" [class.content-card_count--zero_]="visitas() === 0">
      {{ visitas() === 0 ? '0' : (visitas() | number) }}
    </div>
  </div>
</div>
