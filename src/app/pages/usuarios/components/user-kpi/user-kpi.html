<article class="kpi-card" [attr.aria-busy]="loading()">
  <header class="kpi-card__head">
    @if (loading()) {
      <app-skeleton width="11rem" height="14px" class="kpi-skeleton"></app-skeleton>
    } @else {
      <span class="kpi-card__label">
        <svg lucideUsers [size]="14" aria-hidden="true"></svg>
        Total de usuarios registrados
      </span>
    }
  </header>

  @if (loading()) {
    <div class="kpi-card__main" aria-hidden="true">
      <div class="kpi-total">
        <app-skeleton width="8rem" height="40px"></app-skeleton>
        <app-skeleton width="11rem" height="13px"></app-skeleton>
      </div>
  
    </div>

    <!-- <ul class="kpi-stats" aria-hidden="true">

          <app-skeleton width="4rem" height="20px"></app-skeleton>
          <app-skeleton width="7rem" height="11px"></app-skeleton>
        </li>
      }
    </ul> -->
  } @else {
    <div class="kpi-card__main">
      <div class="kpi-total">
        <p class="kpi-total__value">{{ formatNumber(total()) }}</p>
        <p class="kpi-total__unit">
          {{ total() === 1 ? 'usuario' : 'usuarios' }}
          <span class="kpi-total__hint">durante el periodo</span>
        </p>
      </div>


    </div>
