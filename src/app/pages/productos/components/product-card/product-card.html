<a class="product-card" [href]="producto().url" target="_blank">
  <span class="product-card__rank" [class.product-card__rank--leader]="producto().posicion === 1">
    {{ producto().posicion }}
  </span>

  <span class="product-card__thumb" aria-hidden="true">
    @if (imagenFallida() || !tieneImagen()) {
      <svg lucideImageOff [size]="16"></svg>
    } @else {
      <img
        [src]="producto().imagen"
        alt=""
        loading="lazy"
        decoding="async"
        (error)="imagenFallida.set(true)"
      />
    }
  </span>

  <span class="product-card__body">
    <span class="product-card__name">{{ producto().nombre }}</span>
    @if (!producto().estatus ) {
      <span class="product-card__badge">Inactivo</span>
    }
  </span>

  <span class="product-card__metric">
    <span class="product-card__visits">{{ formatNumber(producto().visitas) }}</span>
    <span class="product-card__metric-label">visitas</span>
  </span>

  <span
    class="product-card__share"
    [style.width.%]="producto().proporcion"
    [attr.aria-hidden]="true"
  ></span>
</a>
